name: Build and Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

env:
  SDK_WDK_NUGET_VERSION: '10.0.28000.2526'
  SDK_WDK_PLATFORM_VERSION: '10.0.28000.0'

jobs:
  build-and-release:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set commit metadata
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install Windows SDK and WDK NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:SDK_WDK_NUGET_VERSION
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          foreach ($pkg in @('Microsoft.Windows.SDK.CPP', 'Microsoft.Windows.SDK.CPP.x64', 'Microsoft.Windows.WDK.x64')) {
            nuget install $pkg -Version $ver -OutputDirectory packages -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "nuget install $pkg failed ($LASTEXITCODE)" }
          }

          $pkgRoot = (Resolve-Path 'packages').Path
          @"
          <Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="$pkgRoot\Microsoft.Windows.SDK.CPP.x64.$ver\build\native\Microsoft.Windows.SDK.cpp.x64.props" />
            <Import Project="$pkgRoot\Microsoft.Windows.SDK.CPP.$ver\build\native\Microsoft.Windows.SDK.cpp.props" />
            <Import Project="$pkgRoot\Microsoft.Windows.WDK.x64.$ver\build\native\Microsoft.Windows.WDK.x64.props" />
          </Project>
          "@ | Set-Content -Encoding UTF8 -Path 'Directory.Build.props'

          @"
          <Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="$pkgRoot\Microsoft.Windows.SDK.CPP.$ver\build\native\Microsoft.Windows.SDK.cpp.targets" />
            <ItemDefinitionGroup>
              <ClCompile>
                <DisableSpecificWarnings>4392;%(DisableSpecificWarnings)</DisableSpecificWarnings>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          "@ | Set-Content -Encoding UTF8 -Path 'Directory.Build.targets'

      - name: Build and WDK test-sign hvsnap.sys
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $hasSpectre = $false
          if ($vsPath) {
            $spectreDirs = Get-ChildItem -Path (Join-Path $vsPath 'VC\Tools\MSVC') -Recurse -Directory -Filter 'spectre' -ErrorAction SilentlyContinue
            if ($spectreDirs) { $hasSpectre = $true }
          }

          $msbuildArgs = @(
            'hvsnap.sln',
            '/m',
            '/p:Configuration=Release',
            '/p:Platform=x64',
            '/p:SignMode=TestSign',
            "/p:WindowsTargetPlatformVersion=$($env:SDK_WDK_PLATFORM_VERSION)"
          )
          if (-not $hasSpectre) {
            $msbuildArgs += '/p:SpectreMitigation=false'
            $msbuildArgs += '/p:Driver_SpectreMitigation=false'
          }

          & msbuild @msbuildArgs
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed ($LASTEXITCODE)" }

      - name: Build hvctl.exe and probe.exe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Failed to locate Visual Studio installation with C++ tools
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          pushd hvctl
          cl /nologo /EHsc /W4 /O2 /Fe:hvctl.exe hvctl.cpp snapshot.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /W3 /O2 /Fe:probe.exe probe.cpp
          if errorlevel 1 exit /b 1
          popd

      - name: Stage, WDK test-sign, and verify all signable binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path 'release' | Out-Null
          Copy-Item 'x64\Release\hvsnap.sys' 'release\hvsnap.sys'
          Copy-Item 'x64\Release\hvsnap.cer' 'release\hvsnap.cer'
          if (Test-Path 'x64\Release\hvsnap.pdb') {
            Copy-Item 'x64\Release\hvsnap.pdb' 'release\hvsnap.pdb'
          }
          Copy-Item 'hvctl\hvctl.exe' 'release\hvctl.exe'
          Copy-Item 'hvctl\probe.exe' 'release\probe.exe'

          $cerPath = (Resolve-Path 'release\hvsnap.cer').Path
          $wdkCert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($cerPath)
          $thumbprint = $wdkCert.Thumbprint
          Write-Host "WDK Test Certificate Subject    : $($wdkCert.Subject)"
          Write-Host "WDK Test Certificate Thumbprint : $thumbprint"

          if ($wdkCert.Subject -notlike '*WDKTestCert*') {
            throw "Expected WDKTestCert subject, got: $($wdkCert.Subject)"
          }

          $signtool = "packages\Microsoft.Windows.SDK.CPP.$($env:SDK_WDK_NUGET_VERSION)\c\bin\$($env:SDK_WDK_PLATFORM_VERSION)\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            $signtool = Get-ChildItem "packages\Microsoft.Windows.SDK.CPP.$($env:SDK_WDK_NUGET_VERSION)" -Recurse -Filter signtool.exe |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool -or -not (Test-Path $signtool)) {
            throw "signtool.exe not found in SDK NuGet package"
          }
          Write-Host "Using signtool: $signtool"

          $storeArgs = $null
          foreach ($candidate in @(
            @{ Path = 'Cert:\CurrentUser\My';                Args = @('/s', 'My') },
            @{ Path = 'Cert:\CurrentUser\PrivateCertStore';  Args = @('/s', 'PrivateCertStore') },
            @{ Path = 'Cert:\LocalMachine\My';               Args = @('/sm', '/s', 'My') },
            @{ Path = 'Cert:\LocalMachine\PrivateCertStore'; Args = @('/sm', '/s', 'PrivateCertStore') }
          )) {
            if (Test-Path $candidate.Path) {
              $found = Get-ChildItem $candidate.Path |
                Where-Object { $_.Thumbprint -eq $thumbprint -and $_.HasPrivateKey } |
                Select-Object -First 1
              if ($found) {
                $storeArgs = $candidate.Args
                Write-Host "Found WDKTestCert private key in $($candidate.Path)"
                break
              }
            }
          }
          if (-not $storeArgs) {
            throw "Could not locate WDKTestCert ($thumbprint) with private key in any certificate store"
          }

          $signableExts = @('.sys', '.exe', '.dll', '.ocx', '.scr', '.efi', '.cat')
          $binaries = Get-ChildItem -Path 'release' -File |
            Where-Object { $signableExts -contains $_.Extension.ToLowerInvariant() }
          if ($binaries.Count -eq 0) {
            throw "No signable binaries found in release\"
          }

          foreach ($bin in $binaries) {
            $sig = Get-AuthenticodeSignature -FilePath $bin.FullName
            if ($sig.SignerCertificate -and $sig.SignerCertificate.Thumbprint -eq $thumbprint) {
              Write-Host "Already WDK test-signed: $($bin.Name)"
              continue
            }
            Write-Host "WDK test-signing: $($bin.Name)"
            & $signtool sign /v /ph /fd sha256 @storeArgs /sha1 $thumbprint $bin.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed for $($bin.Name) ($LASTEXITCODE)"
            }
          }

          Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null

          foreach ($bin in $binaries) {
            Write-Host "`nVerifying $($bin.Name)..."
            & $signtool verify /v /pa $bin.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verify failed for $($bin.Name) ($LASTEXITCODE)"
            }
            $sig = Get-AuthenticodeSignature -FilePath $bin.FullName
            Write-Host "Status     : $($sig.Status)"
            Write-Host "Subject    : $($sig.SignerCertificate.Subject)"
            Write-Host "Thumbprint : $($sig.SignerCertificate.Thumbprint)"
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode signature invalid for $($bin.Name): $($sig.Status) ($($sig.StatusMessage))"
            }
            if ($sig.SignerCertificate.Thumbprint -ne $thumbprint) {
              throw "Signature thumbprint mismatch for $($bin.Name): expected $thumbprint, got $($sig.SignerCertificate.Thumbprint)"
            }
          }

          Compress-Archive -Path 'release\*' -DestinationPath "hvsnap-x64-$($env:SHORT_SHA).zip" -Force

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.SHORT_SHA }}
          name: build-${{ env.SHORT_SHA }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          make_latest: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          files: |
            hvsnap-x64-${{ env.SHORT_SHA }}.zip
            release/hvsnap.sys
            release/hvctl.exe
            release/probe.exe
            release/hvsnap.cer
